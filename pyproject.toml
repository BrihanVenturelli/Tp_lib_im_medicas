[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioimagenes"
version = "0.1.0"
description = "Librería de procesamiento de imágenes médicas"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "matplotlib"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]